name: Release

on:
  push:
    tags: ["v*"]
  # Manual run (e.g. from a phone): releases the version in package.json under
  # the given tag, which the release step creates if it does not exist.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        default: v0.1.6-fork.1

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run pack
      # jsDelivr serves the cdn branch. Publish the bundle first so the skill
      # can pin the exact commit and an integrity hash of this same file.
      - if: matrix.os == 'ubuntu-latest'
        name: Publish the browser bundle and build the pinned skill
        env:
          REPO: ${{ github.repository }}
        run: |
          npm run build:web
          version="$(node -p "require('./package.json').version")"
          git fetch --depth 1 origin cdn
          git worktree add ../cdn FETCH_HEAD
          # Exact-version folders only; nothing is overwritten after release.
          if [ -e "../cdn/$version" ]; then echo "cdn/$version already exists" >&2; exit 1; fi
          mkdir -p "../cdn/$version"
          cp build/web/sketchy.js build/parts.json "../cdn/$version/"
          (
            cd ../cdn
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(cdn): publish $version"
            git push origin HEAD:cdn
          )
          SKETCHY_REPO="$REPO" SKETCHY_CDN_REF="$(git -C ../cdn rev-parse HEAD)" npm run build:skill
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            *.mcpb
            sketchy-skill-*.zip
          draft: true
